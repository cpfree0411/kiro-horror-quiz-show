<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admit One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@500;700&family=Special+Elite&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0b0508; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 16px; background: radial-gradient(circle at 50% 30%, #3a1016, #0b0508 72%); font-family: 'Special Elite', monospace; color: #241612; }
  .ticket { position: relative; width: min(100%, 360px); padding: 30px 24px 22px; background: linear-gradient(#f6edd8, #e6d8b8); box-shadow: 0 14px 40px rgba(0, 0, 0, .6); transform: rotate(-1deg);
    -webkit-mask: radial-gradient(circle 13px at 0 calc(100% - 92px), transparent 98%, #000), radial-gradient(circle 13px at 100% calc(100% - 92px), transparent 98%, #000); -webkit-mask-composite: source-in; mask: radial-gradient(circle 13px at 0 calc(100% - 92px), transparent 98%, #000), radial-gradient(circle 13px at 100% calc(100% - 92px), transparent 98%, #000); mask-composite: intersect; }
  .admit { font-family: 'Stardos Stencil', serif; font-weight: 700; font-size: 44px; text-align: center; color: #b8202d; letter-spacing: 3px; line-height: 1; }
  .title { margin: 10px 0 22px; text-align: center; font-size: 17px; letter-spacing: 2px; border-block: 2px solid #241612; padding: 8px 0; }
  label { display: block; font-size: 16px; margin-bottom: 8px; }
  input { width: 100%; height: 56px; padding: 0 14px; border: 2px solid #241612; border-radius: 2px; background: #fffaf0; color: #241612; font: 700 24px 'Fredoka', 'Black Han Sans', sans-serif; font-synthesis: none; outline-offset: 2px; }
  button { width: 100%; height: 58px; margin-top: 12px; border: 0; border-radius: 2px; background: #b8202d; color: #fff3df; font: 700 26px 'Stardos Stencil', serif; letter-spacing: 2px; cursor: pointer; box-shadow: 0 4px 0 #6c0d17; }
  button:disabled { opacity: .6; }
  .err { min-height: 22px; margin-top: 8px; color: #a01522; font-size: 15px; }
  .stub { margin-top: 18px; padding-top: 18px; border-top: 2px dashed #8a7858; display: flex; justify-content: space-between; font-size: 14px; }
  .stamp { position: absolute; left: 50%; top: 42%; padding: 8px 14px; border: 5px solid #b8202d; border-radius: 6px; color: #b8202d; font: 700 40px 'Stardos Stencil', serif; letter-spacing: 2px; white-space: nowrap; opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(2); pointer-events: none; }
  .admitted .stamp { opacity: .86; transform: translate(-50%, -50%) rotate(-12deg) scale(1); transition: transform .18s cubic-bezier(.2, 1.6, .4, 1), opacity .1s; }
  .admitted form { visibility: hidden; }
  .done { display: none; position: absolute; left: 24px; right: 24px; bottom: 112px; text-align: center; font-size: 17px; }
  .admitted .done { display: block; }
  .name { font: 700 28px 'Fredoka', 'Black Han Sans', sans-serif; font-synthesis: none; margin-bottom: 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="ticket" id="ticket">
  <div class="admit">ADMIT ONE</div>
  <div class="title">KIRO HORROR QUIZ SHOW</div>
  <form id="form">
    <label for="name">YOUR STAGE NAME</label>
    <input id="name" maxlength="12" autocomplete="off" required>
    <button id="go">GET IN</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="done"><div class="name" id="who"></div>LOOK AT THE BIG SCREEN</div>
  <div class="stamp">ADMITTED</div>
  <div class="stub"><span>1–3 PLAYERS</span><span>NO. 1031</span></div>
</main>
<script>
  // When attached to an engine, define window.KHQS_TICKET_JOIN = async name => ({ ok: true } | { error: '...' }) first.
  // Without it, the ticket talks to a same-origin stage demo tab over BroadcastChannel.
  const demoJoin = name => new Promise(resolve => {
    if (!('BroadcastChannel' in window)) return resolve({ error: 'THE BOX OFFICE IS CLOSED' });
    const ch = new BroadcastChannel('khqs-ticket'), id = Math.random().toString(36).slice(2);
    const t = setTimeout(() => { ch.close(); resolve({ error: 'THE BOX OFFICE IS CLOSED' }); }, 1500);
    ch.onmessage = e => { if (e.data.reply === id) { clearTimeout(t); ch.close(); resolve(e.data); } };
    ch.postMessage({ type: 'join', id, name });
  });
  const $ = id => document.getElementById(id);
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name) return;
    $('go').disabled = true; $('err').textContent = '';
    const r = await (window.KHQS_TICKET_JOIN || demoJoin)(name);
    $('go').disabled = false;
    if (r.error) { $('err').textContent = r.error; return; }
    $('who').textContent = name;
    $('ticket').classList.add('admitted');
  });
</script>
</body>
</html>
