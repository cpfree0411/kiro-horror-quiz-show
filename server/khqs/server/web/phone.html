<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiro Horror Quiz Show: Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/phone/phone.css">
</head>
<body>
<div id="pc">
  <header id="pc-head"><div class="who"><span id="pc-name">&nbsp;</span></div><div class="score"><b id="pc-score">0</b><small id="pc-rank"></small></div></header>
  <div id="pc-banner" hidden></div>
  <main id="pc-main" data-screen="connecting"><p class="big">CONNECTING…</p></main>
  <footer id="pc-foot"><div id="pc-bar"><i></i></div><span id="pc-timer"></span><span id="pc-toast" role="status"></span></footer>
</div>
<script src="/phone/phone.js"></script>
</body>
</html>
